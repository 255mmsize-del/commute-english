<title>나의 영어 노트</title>
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 한 손 모바일 학습 앱 — 상단 앱바(연속일·XP) + 화면 스택 + 하단 탭 5개.
   레슨은 전체 화면(위 진행바·X, 아래 정답 피드백 시트). 남색 잉크 + 황동, 영어는 세리프 */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --surface-2: #EEF0F5; --ink: #141A2A; --muted: #646C80; --line: #E1E4EC;
  --navy: #14213D; --navy-2: #22355E; --brass: #A8834A; --brass-soft: #F3ECDF; --flame: #E0702A;
  --hl: #C0392B; --good: #2F7D57; --good-soft: #E3F1EA; --warn: #B7791F; --warn-soft: #F8EEDB; --bad-soft: #F8E4E1;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(20,26,42,.05), 0 8px 24px rgba(20,26,42,.06);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en: "Newsreader", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D111B; --surface: #161C2A; --surface-2: #1D2436; --ink: #E8EAF0; --muted: #98A0B4; --line: #262E42;
  --navy: #2A3D68; --navy-2: #34497A; --brass: #D4B27A; --brass-soft: #2C2618; --flame: #FF9A55;
  --hl: #FF8A7A; --good: #6CC795; --good-soft: #17301F; --warn: #E8B865; --warn-soft: #33281A; --bad-soft: #3A1F1C;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D111B; --surface: #161C2A; --surface-2: #1D2436; --ink: #E8EAF0; --muted: #98A0B4; --line: #262E42;
  --navy: #2A3D68; --navy-2: #34497A; --brass: #D4B27A; --brass-soft: #2C2618; --flame: #FF9A55;
  --hl: #FF8A7A; --good: #6CC795; --good-soft: #17301F; --warn: #E8B865; --warn-soft: #33281A; --bad-soft: #3A1F1C;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }
body.lesson-mode .app { padding-block-end: 230px; }
body.lesson-mode nav.tabs { display: none; }

/* 앱바 */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-inline: -16px; padding: 12px 16px 10px;
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; min-height: 64px; }
.appbar h1 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar.root { grid-template-columns: 1fr auto; }
.appbar.root h1 { text-align: left; font-size: 22px; letter-spacing: -0.01em; }
.appbar .stats { display: flex; gap: 6px; }
.chip-stat { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-num); font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.chip-stat svg { width: 16px; height: 16px; }
.chip-stat.flame { color: var(--flame); } .chip-stat.xp { color: var(--brass); }
.chip-stat.aud { color: var(--ink); cursor: pointer; } .bar-r { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.ex3 { display: grid; gap: 10px; } .ex3 .ex-item { border: 0; padding: 0; }
.chip-stat.off { color: var(--muted); }
.appbar.lesson { grid-template-columns: 40px 40px 1fr auto; }
.appbar .ibtn:disabled { opacity: .3; }
.lbar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.lbar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.combo { font-family: var(--f-num); font-size: 12px; font-weight: 600; color: var(--flame); min-width: 44px; text-align: right; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink); }
.ibtn:hover { background: var(--surface-2); }
.ibtn svg { width: 22px; height: 22px; }

/* 하단 탭 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
nav.tabs .in { pointer-events: auto; max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 6px; }
nav.tabs button { position: relative; background: none; border: 0; border-radius: 16px; padding: 7px 2px; display: grid; justify-items: center; gap: 1px; font-size: 11px; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface-2); font-weight: 600; }
nav.tabs .dotn { position: absolute; top: 3px; right: calc(50% - 22px); min-width: 16px; height: 16px; border-radius: 99px; background: var(--hl); color: #fff; font-size: 10px; font-family: var(--f-num); display: grid; place-items: center; padding: 0 4px; }

/* 공통 */
.en { font-family: var(--f-en); font-weight: 600; letter-spacing: -0.005em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.view { display: grid; gap: 20px; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-weight: 500; color: var(--muted); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
mark { background: none; color: var(--hl); font-weight: 700; }
.primary { border: 0; background: var(--navy); color: var(--on-navy); border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 15.5px; box-shadow: 0 3px 0 color-mix(in srgb, var(--navy) 60%, #000); }
.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--navy) 60%, #000); }
.primary.go { background: var(--good); box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 60%, #000); color: #fff; }
.primary.stop { background: var(--hl); box-shadow: 0 3px 0 color-mix(in srgb, var(--hl) 60%, #000); color: #fff; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; font-weight: 600; }
.block { display: grid; gap: 8px; }
.block p { margin: 0; white-space: pre-line; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13px; }
.pill svg { width: 16px; height: 16px; }
.ico { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }
.ico svg { width: 18px; height: 18px; }

/* 홈 */
.goal { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 18px; }
.goal b { font-size: 17px; } .goal p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; grid-column: 1 / -1; }
.week span { display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.week i { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: #fff; }
.week i.on { background: var(--flame); } .week i svg { width: 14px; height: 14px; }
.week i.today { outline: 2px solid var(--flame); outline-offset: 2px; }
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: var(--on-navy);
  background: radial-gradient(120% 90% at 100% 0%, var(--navy-2), var(--navy) 60%); display: grid; gap: 10px; box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(212,178,122,.35); pointer-events: none; }
.hero .label { color: #D4B27A; } /* 남색 배경 위 고정 색 — 두 테마 공통 */
.hero h3 { margin: 0; font-size: 21px; line-height: 1.3; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; }
.hero .primary { background: #D4B27A; color: #14213D; box-shadow: 0 3px 0 #8E6E3C; position: relative; z-index: 1; }
.hero .mix { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .mix span { font-size: 12px; background: rgba(255,255,255,.1); border-radius: 99px; padding: 2px 10px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qbtn { text-align: left; padding: 14px; display: grid; gap: 4px; align-content: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.qbtn .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--brass-soft); color: var(--brass); }
.qbtn .ic svg { width: 19px; height: 19px; }
.qbtn b { font-size: 14.5px; } .qbtn small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.qbtn .badge-n { justify-self: start; font-family: var(--f-num); font-size: 12px; color: var(--hl); font-weight: 600; }

/* 코스 경로 */
.path { display: grid; gap: 10px; }
.unit { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); width: 100%; }
.unit .node { width: 52px; height: 52px; position: relative; display: grid; place-items: center; }
.unit .node svg.r { position: absolute; inset: 0; }
.unit .node b { font-family: var(--f-num); font-size: 14px; position: relative; }
.unit .node .crown { position: relative; color: var(--brass); width: 22px; height: 22px; }
.unit .t { display: grid; gap: 2px; min-width: 0; }
.unit .t b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .t small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .go { font-size: 12px; font-weight: 700; color: var(--good); }
.unit.current { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy), var(--shadow); }
.unit.done .go { color: var(--brass); }

/* 목록·페이지 */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.list { display: grid; overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 13px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .en { font-size: 17.5px; min-width: 0; overflow-wrap: anywhere; }
.row .ko { grid-column: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .side { grid-row: 1 / 3; grid-column: 2; display: grid; justify-items: end; align-content: center; gap: 4px; font-size: 11px; color: var(--muted); }
.lv { display: inline-flex; gap: 2px; }
.lv i { width: 5px; height: 12px; border-radius: 2px; background: var(--line); }
.lv i.on { background: var(--good); }
.star { color: var(--brass); }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); gap: 8px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager button { min-width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: none; font-family: var(--f-num); font-size: 13px; color: var(--muted); padding: 0 6px; }
.pager button[aria-current="page"] { background: var(--navy); color: var(--on-navy); }
.pager button.nav { border-color: var(--line); background: var(--surface); color: var(--ink); font-family: var(--f-ui); }
.pager .gap { color: var(--muted); padding: 0 2px; }
.badge { display: inline-block; font-size: 10.5px; color: var(--brass); background: var(--brass-soft); border-radius: 99px; padding: 1px 8px; margin-left: 6px; font-weight: 700; vertical-align: 2px; }
.sec-list { display: grid; gap: 8px; }
.sec-btn { text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.sec-btn b { font-size: 15px; } .sec-btn small { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.sec-btn .num { grid-row: 1 / 3; grid-column: 2; color: var(--muted); font-size: 12px; }

/* 상세 */
.detail-head { display: grid; gap: 10px; padding: 20px; }
.detail-head .en { font-size: 32px; line-height: 1.12; overflow-wrap: anywhere; font-weight: 500; }
.pic { background: var(--brass-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.thinkbox { border-left: 3px solid var(--brass); padding: 2px 0 2px 14px; }
.thinkbox p { font-family: var(--f-en); font-size: 17px; line-height: 1.55; white-space: normal; margin: 0; }
.thinkbox .think-say { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.ex { display: grid; }
.ex-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; padding-block: 11px; border-top: 1px solid var(--line); }
.ex-item:first-child { border-top: 0; padding-top: 0; }
.ex-item .e { font-family: var(--f-en); font-size: 16.5px; white-space: pre-line; min-width: 0; }
.ex-item .k { grid-column: 1; color: var(--muted); font-size: 13px; white-space: pre-line; }
.say { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; grid-row: 1 / 3; grid-column: 2; }
.say svg { width: 18px; height: 18px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pair > div { min-width: 0; }
.stepper { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.stepper .num { font-size: 12px; color: var(--muted); text-align: center; }

/* 레슨 문제 */
.qhead { display: grid; gap: 6px; }
.qhead .label { color: var(--brass); }
.qhead h3 { margin: 0; font-size: 19px; line-height: 1.35; }
.prompt { padding: 22px 18px; display: grid; gap: 12px; text-align: center; }
.prompt .en { font-size: 30px; line-height: 1.2; font-weight: 500; overflow-wrap: anywhere; }
.prompt .kq { font-size: 19px; font-weight: 600; white-space: pre-line; }
.prompt .sent { font-family: var(--f-en); font-size: 20px; line-height: 1.5; }
.prompt .sent u { text-decoration: none; border-bottom: 2px solid var(--brass); padding: 0 1.4em; }
.prompt .sub { color: var(--muted); font-size: 13px; white-space: pre-line; }
.say-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.big-say { justify-self: center; display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--brass-soft); color: var(--ink); border-radius: 99px; padding: 10px 18px; font-weight: 600; }
.big-say svg { width: 20px; height: 20px; color: var(--brass); }
.big-say.xl { width: 96px; height: 96px; padding: 0; justify-content: center; border-radius: 50%; }
.big-say.xl svg { width: 40px; height: 40px; }
.big-say.slow { background: var(--surface-2); }
.playing { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brass) 35%, transparent); }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 15px 16px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; box-shadow: 0 2px 0 var(--line); display: grid; gap: 2px; }
.choice:disabled { opacity: 1; }
.choice .en { font-size: 17.5px; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--hl); background: var(--bad-soft); }
.learn { padding: 22px 20px; display: grid; gap: 14px; }
.learn .en { font-size: 32px; line-height: 1.15; font-weight: 500; text-align: center; }
.learn .mean { font-size: 17px; font-weight: 600; white-space: pre-line; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 52px; }
.tile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-family: var(--f-en); font-size: 17px; box-shadow: 0 2px 0 var(--line); }
.tile:disabled { opacity: 1; }
.tile.used { visibility: hidden; }
.answer-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-end; padding-bottom: 10px; }
.typing input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-family: var(--f-en); font-size: 19px; }
.mic-wrap { display: grid; justify-items: center; gap: 10px; }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--navy); color: var(--on-navy); display: grid; place-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--navy) 60%, #000); }
.mic svg { width: 36px; height: 36px; }
.mic.rec { background: var(--hl); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--hl) 45%, transparent); } 50% { box-shadow: 0 0 0 14px transparent; } }
.heard { font-family: var(--f-en); font-size: 17px; min-height: 26px; color: var(--muted); text-align: center; }
.scored { font-family: var(--f-en); font-size: 21px; line-height: 1.6; text-align: center; }
.scored .ok, .bubble .ok { color: var(--good); } .scored .miss, .bubble .miss { color: var(--hl); text-decoration: underline wavy; text-underline-offset: 4px; }
.bubble.me .ok { color: #9BE2B8; } .bubble.me .miss { color: #FFB3A8; }
.score-num { font-family: var(--f-num); font-size: 34px; font-weight: 600; text-align: center; }

/* 롤플레이 */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 12px 14px; border-radius: 18px; display: grid; gap: 4px; }
.bubble .e { font-family: var(--f-en); font-size: 16.5px; }
.bubble .k { font-size: 12.5px; color: var(--muted); }
.bubble.them { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; justify-self: start; }
.bubble.me { background: var(--navy); color: var(--on-navy); border-bottom-right-radius: 6px; justify-self: end; }
.bubble.me .k { color: rgba(244,241,234,.75); }
.bubble.todo { background: var(--brass-soft); border: 1.5px dashed var(--brass); justify-self: end; border-bottom-right-radius: 6px; }
.bubble .sc { font-family: var(--f-num); font-size: 11px; justify-self: end; opacity: .85; }

/* 피드백 시트 */

<script id="vocab-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
"use strict";
/* ===================== 데이터 ===================== */
const DATA = JSON.parse(document.getElementById("vocab-data").textContent);
const SRC_NAME = { w: "단어장", p: "구동사·숙어", t: "문장패턴" };
const SOURCES = { w: [], p: [], t: [] };
DATA.words.forEach(w => SOURCES.w.push({ ...w, key: "w:" + w.no, src: "w", en: w.w, ko: w.mean }));
[["p", "phrasal"], ["t", "pattern"]].forEach(([src, k]) => DATA[k].forEach((sec, si) => sec.items.forEach(it =>
  SOURCES[src].push({ ...it, key: src + ":" + it.expr, src, en: it.expr, si, isNew: sec.title.startsWith("➕") }))));
const ALL = {};
Object.values(SOURCES).forEach(list => list.forEach(i => { ALL[i.key] = i; }));
const TOTAL = SOURCES.w.length + SOURCES.p.length + SOURCES.t.length;
const PAGE = 10;

/* 코스 = 유닛 목록. 단어장은 원본 No 순 20개씩, 영어식 사고는 시트 섹션 그대로 */
const cleanTitle = t => t.replace(/^➕\s*/, "").replace(/\s*\(추가분\)/, "");
const COURSES = {
  w: (() => { const s = [...SOURCES.w].sort((a, b) => +a.no - +b.no); const u = [];
    for (let i = 0; i < s.length; i += 20) { const part = s.slice(i, i + 20); u.push({ title: `Day ${u.length + 1}`, sub: `No.${part[0].no} ~ ${part[part.length - 1].no} · ${part.slice(0, 3).map(x => x.en).join(", ")}…`, keys: part.map(x => x.key) }); }
    return u; })(),
  p: DATA.phrasal.map((sec, si) => ({ title: cleanTitle(sec.title), sub: sec.core, keys: SOURCES.p.filter(i => i.si === si).map(i => i.key), isNew: sec.title.startsWith("➕") })),
  t: DATA.pattern.map((sec, si) => ({ title: cleanTitle(sec.title), sub: sec.core, keys: SOURCES.t.filter(i => i.si === si).map(i => i.key), isNew: sec.title.startsWith("➕") })),
};

/* ===================== 저장(이 기기) · 망각곡선 복습 단계 =====================
   items[key] = { b: 0~5단계, due: 다음 복습 시각, r/w: 맞힘/틀림 횟수, last } */
const STORE = "vocab-note.v3";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const DAY = 864e5;
const INTERVAL = [0, 1, 3, 7, 16, 35];
const ST = load(STORE, {});
ST.items ||= {}; ST.days ||= {}; ST.stars ||= []; ST.wrong ||= []; ST.ach ||= {};
ST.stats = Object.assign({ speak: 0, role: 0, lessons: 0, maxCombo: 0, answered: 0, tested: false }, ST.stats);
ST.set = Object.assign({ goal: 50, rate: 0.9, repeat: 1, auto: true, sfx: true, course: "w" }, ST.set);
ST.devId ||= Math.random().toString(36).slice(2, 10);
ST.starT ||= {}; ST.setT ||= 0; ST.others ||= {}; ST.sync ||= null;
const DEV_NAME = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "휴대폰" : "PC";
(function migrate() {   // 2차 버전 기록(외움/헷갈림·즐겨찾기) 이어받기
  if (Object.keys(ST.items).length || ST.migrated) return;
  const old = load("vocab-note.v2", null) || {};
  for (const [k, v] of Object.entries(old)) if (ALL[k]) ST.items[k] = { b: v.s === 2 ? 3 : 0, due: Date.now(), r: v.s === 2 ? 1 : 0, w: v.s < 2 ? 1 : 0, last: v.t || Date.now() };
  ST.stars = load("vocab-note.v2.stars", ST.stars); ST.migrated = true;
})();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(ST)); } catch (e) {} };
const stars = new Set(ST.stars);
const seen = k => !!ST.items[k];
const box = k => (ST.items[k] ? ST.items[k].b : -1);
const isDue = k => !!ST.items[k] && ST.items[k].due <= Date.now();
const mastered = k => box(k) >= 4;
const dueKeys = () => Object.keys(ST.items).filter(k => ALL[k] && isDue(k)).sort((a, b) => ST.items[a].due - ST.items[b].due);
function grade(k, ok) {
  const s = ST.items[k] || { b: 0, due: 0, r: 0, w: 0 };
  if (ok) { s.b = Math.min(5, s.b + (s.r + s.w === 0 ? 2 : 1)); s.r++; }
  else { s.b = Math.max(0, s.b - 2); s.w++; if (!ST.wrong.includes(k)) ST.wrong.unshift(k); }
  if (ok && s.b >= 3) ST.wrong = ST.wrong.filter(x => x !== k);
  s.due = Date.now() + INTERVAL[s.b] * DAY - (INTERVAL[s.b] ? 3 * 36e5 : 0); // 하루 이상 간격은 3시간 일찍 열어 줌
  s.last = Date.now(); ST.items[k] = s; ST.stats.answered++;
}
function learned(k) { if (!ST.items[k]) ST.items[k] = { b: 0, due: Date.now() + 10 * 6e4, r: 0, w: 0, last: Date.now() }; }
function toggleStar(k) { stars.has(k) ? stars.delete(k) : stars.add(k); ST.stars = [...stars]; ST.starT[k] = Date.now(); save(); scheduleSync(); }
const touchSet = () => { ST.setT = Date.now(); save(); scheduleSync(); };

const dkey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dkey(new Date());
const dayRec = () => (ST.days[today()] ||= { xp: 0, n: 0, speak: 0 });   // 쓰기는 이 기기 기록에만
const allDays = () => [ST.days, ...Object.values(ST.others).map(o => o.days || {})];
/* 읽기는 모든 기기 합계(같은 날 휴대폰 30 XP + PC 20 XP = 50 XP) */
function aggDay(k) { const r = { xp: 0, n: 0, speak: 0 }; for (const d of allDays()) { const x = d[k]; if (x) { r.xp += x.xp || 0; r.n += x.n || 0; r.speak += x.speak || 0; } } return r; }
const xpToday = () => aggDay(today()).xp;
const totalXP = () => allDays().reduce((a, d) => a + Object.values(d).reduce((b, x) => b + (x.xp || 0), 0), 0);
const totalSpeak = () => allDays().reduce((a, d) => a + Object.values(d).reduce((b, x) => b + (x.speak || 0), 0), 0);
function AS() {
  const all = [ST.stats, ...Object.values(ST.others).map(o => o.stats || {})];
  const sum = k => all.reduce((a, x) => a + (x[k] || 0), 0);
  return { speak: sum("speak"), role: sum("role"), lessons: sum("lessons"), answered: sum("answered"), maxCombo: Math.max(...all.map(x => x.maxCombo || 0)), tested: all.some(x => x.tested) };
}
function addXP(n) { const r = dayRec(); r.xp += n; r.n++; }
function streak() {
  let n = 0; const d = new Date();
  if (!xpToday()) d.setDate(d.getDate() - 1);
  for (;;) { if (!aggDay(dkey(d)).xp) return n; n++; d.setDate(d.getDate() - 1); }
}
const TIERS = [["브론즈", 0, "#9C6B3E"], ["실버", 500, "#7D879B"], ["골드", 1500, "#B88A1E"], ["플래티넘", 3500, "#2F807E"], ["다이아", 7000, "#3F63C4"], ["마스터", 12000, "#7A3FB8"]];
const tierOf = xp => TIERS.reduce((t, x, i) => (xp >= x[1] ? i : t), 0);

/* 도전과제 */
const ACH = [
  ["first", "첫 걸음", "레슨 1회 완료", () => AS().lessons >= 1],
  ["l10", "꾸준함", "레슨 10회 완료", () => AS().lessons >= 10],
  ["s3", "3일 연속", "3일 연속 학습", () => streak() >= 3],
  ["s7", "일주일 불꽃", "7일 연속 학습", () => streak() >= 7],
  ["s30", "한 달 습관", "30일 연속 학습", () => streak() >= 30],
  ["c10", "콤보 10", "한 레슨에서 10문제 연속 정답", () => AS().maxCombo >= 10],
  ["q300", "문제 300개", "누적 300문제 풀기", () => AS().answered >= 300],
  ["m50", "표현 50개 정복", "4단계 이상 표현 50개", () => Object.keys(ST.items).filter(mastered).length >= 50],
  ["m300", "표현 300개 정복", "4단계 이상 표현 300개", () => Object.keys(ST.items).filter(mastered).length >= 300],
  ["sp50", "입이 트이다", "따라 말하기 50문장", () => AS().speak >= 50],
  ["rp5", "대화 연습생", "롤플레이 5회 완료", () => AS().role >= 5],
  ["test", "실력 진단", "실력 진단 테스트 완료", () => AS().tested],
];
function checkAch() {
  const got = [];
  for (const [id, name, , fn] of ACH) if (!ST.ach[id] && fn()) { ST.ach[id] = Date.now(); got.push(name); }
  if (got.length) { save(); toast("도전과제 달성: " + got.join(", "), IC.trophy); }
}

/* ===================== 유틸·아이콘 ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const marked = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
const plain = s => String(s ?? "").replace(/\*\*/g, "");
const firstLine = s => String(s ?? "").split("\n")[0].replace(/^1\.\s*/, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const meaningOf = it => (it.src === "w" ? it.mean : it.ko);
const S = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  back: S('<path d="M15 5l-7 7 7 7"/>'), close: S('<path d="M6 6l12 12M18 6L6 18"/>'),
  speak: S('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'),
  turtle: S('<path d="M4 15c0-4 3.5-7 8-7s8 3 8 7z"/><path d="M20 13h2M6 15l-1 3M18 15l1 3"/>'),
  mic: S('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6.5 1-9.5z"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  star: S('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>'),
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  check: S('<path d="M5 12.5l4.5 4.5L19 7.5"/>'), x: S('<path d="M6 6l12 12M18 6L6 18"/>'),
  crown: S('<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>'),
  trophy: S('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>'),
  review: S('<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/>'),
  chat: S('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>'),
  target: S('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>'),
};
const ico = k => `<span class="ico">${IC[k]}</span>`;
function toast(msg, icon = IC.check) {
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = icon + `<span>${esc(msg)}</span>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

/* ===================== 소리: 음성(반복·속도)·효과음·음성 인식 ===================== */
const TTS = "speechSynthesis" in window;
let speakToken = 0;
const voiceFor = lang => (TTS ? speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith(lang)) : null);
const ttsText = t => plain(t).replace(/^[AB]:\s*/gm, "").replace(/\+\s*[가-힣/·\-]+/g, "").replace(/[가-힣]+/g, "").replace(/[~()[\]]/g, " ").replace(/\s+/g, " ").trim();
function utter(text, lang, rate) {
  return new Promise(res => {
    if (!TTS || !text) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rate;
    const v = voiceFor(lang); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = u.onerror = fin; setTimeout(fin, 1500 + text.length * 170 / rate);
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function stopSpeak() { speakToken++; if (TTS) speechSynthesis.cancel(); document.querySelectorAll(".playing").forEach(b => b.classList.remove("playing")); }
async function sayEn(text, opt = {}) {
  stopSpeak(); const my = speakToken; const t = ttsText(text); if (!t) return;
  const times = opt.repeat ?? ST.set.repeat; const rate = opt.rate ?? ST.set.rate;
  opt.btn?.classList.add("playing");
  const parts = t.length > 140 ? t.match(/[^.!?]+[.!?]+["'”]?|[^.!?]+$/g).map(x => x.trim()).filter(Boolean) : [t];
  for (let i = 0; i < times && my === speakToken; i++) {
    for (let j = 0; j < parts.length && my === speakToken; j++) { await utter(parts[j], "en-US", rate); if (j < parts.length - 1) await wait(250); }
    if (i < times - 1) await wait(600);
  }
  if (my === speakToken) opt.btn?.classList.remove("playing");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if (!b) return;
  e.stopPropagation();
  sayEn(b.dataset.say, { btn: b, rate: b.dataset.slow ? Math.min(0.6, ST.set.rate) : undefined });   // 횟수·속도 = 듣기 설정
}, true);

let actx = null;
function sfx(kind) {
  if (!ST.set.sfx) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();

/* ===================== 기기 간 학습 기록 동기화 =====================
   저장소: 구글시트 '앱_학습기록' 탭(Apps Script 웹 앱). 받기 → 합치기 → 올리기, 서버 rev 로 동시 저장 충돌 방지.
   합치는 규칙: 표현별 기록·★ = 마지막으로 바꾼 쪽, 도전과제 = 먼저 달성한 시각, 오답노트 = 합집합,
   날짜별 XP·통계 = 기기별로 따로 두고 화면에서 합산(같은 날 두 기기 XP 가 더해짐), 설정 = 마지막으로 바꾼 쪽 */
function localDoc() {
  const starObj = {};
  for (const k of new Set([...stars, ...Object.keys(ST.starT)])) starObj[k] = { on: stars.has(k), t: ST.starT[k] || 0 };
  return { v: 1, items: ST.items, stars: starObj, ach: ST.ach, wrong: ST.wrong, set: { ...ST.set, t: ST.setT },
    dev: { ...ST.others, [ST.devId]: { name: DEV_NAME, t: Date.now(), days: ST.days, stats: ST.stats } } };
}
function mergeDoc(a, b) {
  const items = { ...(b.items || {}) };
  for (const [k, v] of Object.entries(a.items || {})) if (!items[k] || (v.last || 0) >= (items[k].last || 0)) items[k] = v;
  const st = { ...(b.stars || {}) };
  for (const [k, v] of Object.entries(a.stars || {})) if (!st[k] || v.t >= st[k].t) st[k] = v;
  const ach = { ...(b.ach || {}) };
  for (const [k, v] of Object.entries(a.ach || {})) ach[k] = ach[k] ? Math.min(ach[k], v) : v;
  const wrong = [...new Set([...(a.wrong || []), ...(b.wrong || [])])].filter(k => !items[k] || items[k].b < 3);
  const set = ((a.set && a.set.t) || 0) >= ((b.set && b.set.t) || 0) ? a.set : b.set;
  const dev = { ...(b.dev || {}) };
  for (const [k, v] of Object.entries(a.dev || {})) if (!dev[k] || k === ST.devId || (v.t || 0) >= (dev[k].t || 0)) dev[k] = v;
  return { v: 1, items, stars: st, ach, wrong, set, dev };
}
function applyDoc(m) {
  ST.items = m.items; ST.ach = m.ach; ST.wrong = m.wrong;
  stars.clear(); ST.starT = {};
  for (const [k, v] of Object.entries(m.stars)) { ST.starT[k] = v.t; if (v.on) stars.add(k); }
  ST.stars = [...stars];
  if (m.set && (m.set.t || 0) > ST.setT) { const { t, ...rest } = m.set; ST.set = Object.assign(ST.set, rest); ST.setT = t; }
  const others = { ...m.dev }; delete others[ST.devId]; ST.others = others;
}
let syncing = false, syncTimer = null;
function scheduleSync(ms = 5000) { if (!ST.sync) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), ms); }
async function syncNow(manual) {
  const c = ST.sync; if (!c || !c.url || syncing) return;
  syncing = true;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const g = await (await fetch(`${c.url}?key=${encodeURIComponent(c.key)}&t=${Date.now()}`)).json();
      if (!g.ok) throw new Error(g.error || "server");
      const remote = g.data ? JSON.parse(g.data) : null;
      const merged = remote ? mergeDoc(localDoc(), remote) : localDoc();
      applyDoc(merged);
      const p = await (await fetch(c.url, { method: "POST", body: JSON.stringify({ key: c.key, baseRev: g.rev, data: JSON.stringify(merged) }) })).json();
      if (p.ok) { c.rev = p.rev; c.at = Date.now(); c.err = ""; break; }
      if (p.error !== "conflict") throw new Error(p.error || "server");
    }
    if (manual) toast(`동기화 완료 · 연결된 기기 ${1 + Object.keys(ST.others).length}대`);
  } catch (e) {
    c.err = e.message === "key" ? "동기화 키가 맞지 않아요" : "연결에 실패했어요 (인터넷 연결이나 웹 앱 주소를 확인해 주세요)";
    if (manual) toast(c.err, IC.x);
  } finally {
    syncing = false; save();
    const a = document.activeElement;
    if (stack.length === 1 && !(a && a.matches("input"))) render(false);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ST.sync && Date.now() - (ST.sync.at || 0) > 60000) syncNow(false); });
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

function connect(url, key) {
  url = String(url || "").trim(); key = String(key || "").trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !key) { toast("웹 앱 주소(https://script.google.com/…)와 동기화 키를 확인해 주세요", IC.x); return false; }
  ST.sync = { url, key, rev: 0, at: 0, err: "" }; save();
  toast("연결했어요. 기록을 합치는 중…");
  syncNow(true); return true;
}
function connectFromLink() {   // 다른 기기 연결 링크(#sync-…)로 열었을 때
  const h = location.hash;
  if (!h.startsWith("#sync-")) return;
  try { const { u, k } = JSON.parse(unb64u(h.slice(6))); history.replaceState(history.state, "", location.pathname); connect(u, k); }
  catch (e) { toast("연결 링크가 올바르지 않아요", IC.x); }
}
function syncBlock() {
  const c = ST.sync;
  if (!c) return `<div class="block"><h2>기기 동기화 <small>휴대폰·PC 기록 합치기</small></h2><div class="panel" style="padding:16px;display:grid;gap:10px">
    <p class="note">다른 기기에서 받은 '연결 링크'를 이 기기에서 열면 바로 연결돼요. 직접 넣으려면 아래 두 칸을 채워 주세요.</p>
    <input id="syncUrl" class="search" style="padding:11px 14px" placeholder="웹 앱 주소 https://script.google.com/macros/s/…/exec" autocomplete="off">
    <input id="syncKey" class="search" style="padding:11px 14px" placeholder="동기화 키" autocomplete="off">
    <button class="primary" data-sync-connect>연결하기</button></div></div>`;
  const n = 1 + Object.keys(ST.others).length;
  const at = c.at ? new Date(c.at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "아직 없음";
  return `<div class="block"><h2>기기 동기화 <small>연결된 기기 ${n}대 · 이 기기: ${DEV_NAME}</small></h2><div class="panel" style="padding:16px;display:grid;gap:10px">
    <p style="margin:0">${c.err ? `<span style="color:var(--hl)">${esc(c.err)}</span>` : `마지막 동기화 ${esc(at)}`}</p>
    <p class="note">앱을 열 때, 레슨·대화를 마칠 때, ★·설정을 바꿀 때 자동으로 합쳐져요. 같은 날 여러 기기에서 얻은 XP는 더해져요.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="primary" data-sync-now>${syncing ? "동기화 중…" : "지금 동기화"}</button><button class="ghost" data-sync-link>다른 기기 연결 링크</button></div>
    <button class="pill" data-sync-off style="justify-self:start">이 기기 연결 해제</button></div></div>`;
}

/* ===================== 렌더·이벤트 ===================== */
const VIEWS = { home: vHome, review: vReview, speak: vSpeak, dict: vDict, me: vMe, section: vSection, detail: vDetail, lesson: vLesson, role: vRole };
function render(scrollTop) {
  const st = cur();
  if (st.v !== "lesson") document.body.classList.remove("lesson-mode");
  main.innerHTML = `<section class="view">${VIEWS[st.v]()}</section>`;
  lessonFooter();
  if (scrollTop) window.scrollTo(0, 0);
  bindInputs();
  const n = dueKeys().length; const dn = document.getElementById("dueN"); dn.hidden = !n; dn.textContent = n > 99 ? "99+" : n;
}
function bindInputs() {
  const inp = document.getElementById("q");
  if (inp) inp.addEventListener("input", () => { cur().q = inp.value; cur().page = 1; const pos = inp.selectionStart; render(false); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
  const t = document.getElementById("typed");
  if (t && !t.disabled) { t.focus({ preventScroll: true }); t.addEventListener("input", () => { cur().L.qs[cur().L.i].given = t.value; }); }
}
const normT = s => words(s).join(" ");
function checkCurrent() {
  const L = cur().L; if (!L || L.answered) return; const q = L.qs[L.i];
  if (q.type === "order") { if (!q.picked.length) return; return answer(normT(q.picked.map(i => q.tiles[i].w).join(" ")) === normT(q.sent.en)); }
  if (q.type === "type") { q.given = document.getElementById("typed")?.value || ""; answer(normT(q.given) === normT(q.target)); sayEn(ALL[q.key].en, { repeat: 1 }); }
}
async function lessonSpeak() {
  const st = cur(); const L = st.L; const q = L.qs[L.i];
  if (rec) return stopListen();
  const btn = document.querySelector("[data-mic]"), heard = document.getElementById("heard");
  btn?.classList.add("rec"); if (heard) heard.textContent = "듣고 있어요… (다시 누르면 끝)";
  try {
    const alts = await listenOnce(t => { const h = document.getElementById("heard"); if (h) h.textContent = t; });
    if (cur() !== st || L.qs[L.i] !== q) return;
    q.result = scoreSpeech(q.sent.en, alts.length ? alts : [""]);
    dayRec().speak++; ST.stats.speak++;
    answer(q.result.pct >= 70);
  } catch (e) { btn?.classList.remove("rec"); if (heard) heard.textContent = micError(e); }
}
function startUnit(course, ui) {
  const u = COURSES[course][ui];
  const fresh = u.keys.filter(k => !seen(k)).slice(0, 5);
  const rev = fresh.length ? u.keys.filter(k => seen(k) && isDue(k)).slice(0, 3) : shuffle(u.keys).slice(0, 10);
  startLesson(buildLesson(fresh, rev, "lesson"));
}
/* 실력 진단: 세 자료에서 고르게 20문제(뜻·영어·듣기). 맞힌 표현은 2단계로 시작 */
function startTest() {
  const pick = (src, n) => shuffle(SOURCES[src]).slice(0, n).map(i => i.key);
  const keys = shuffle([...pick("w", 10), ...pick("p", 5), ...pick("t", 5)]);
  startLesson(newL(keys.map((k, i) => makeQ(["mean", "en", "listen"][i % 3], k)).filter(Boolean), "test"));
}

main.addEventListener("submit", e => { if (e.target.matches("[data-typeform]")) { e.preventDefault(); checkCurrent(); } });
document.addEventListener("click", e => {
  const t = e.target; if (!t.closest("#main, #fb")) return;
  const st = cur();
  const open = t.closest("[data-open]"); if (open) return push("detail", { key: open.dataset.open, ctx: open.dataset.ctx });
  const tg = t.closest("[data-tabgo]"); if (tg) return goTab(tg.dataset.tabgo);
  const pg = t.closest("[data-page]"); if (pg && !pg.disabled) { st.page = +pg.dataset.page; return render(true); }
  /* 홈 */
  if (t.closest("[data-today]")) { const p = todayPlan(); return startLesson(buildLesson(p.fresh, p.rev)); }
  const cs = t.closest("[data-course]"); if (cs) { ST.set.course = cs.dataset.course; touchSet(); st.page = undefined; return render(false); }
  const un = t.closest("[data-unit]"); if (un) return startUnit(ST.set.course, +un.dataset.unit);
  const uo = t.closest("[data-unit-of]"); if (uo) { const [c, i] = uo.dataset.unitOf.split(":"); return startUnit(c, +i); }
  if (t.closest("[data-leveltest]")) return startTest();
  /* 복습 */
  if (t.closest("[data-review]")) return startLesson(buildLesson([], dueKeys().slice(0, 15), "review"));
  const rl = t.closest("[data-rlist]"); if (rl) { st.list = rl.dataset.rlist; st.page = 1; rootState.review = { list: st.list }; return render(false); }
  if (t.closest("[data-rlist-study]")) return startLesson(buildLesson([], shuffle(ctxLists.rev).slice(0, 15), "review"));
  /* 스피킹 */
  const sh = t.closest("[data-shadow]"); if (sh) return startShadow(sh.dataset.shadow);
  const rp = t.closest("[data-rpick]"); if (rp) { st.rp = rp.dataset.rpick; rootState.speak = { rp: st.rp }; return render(false); }
  if (t.closest("[data-roleplay]")) { const R = pickDialog((rootState.speak || {}).rp || "recent"); if (st.v === "role") { stopSpeak(); stopListen(); st.R = R; render(true); } else push("role", { R }); return playA(); }
  if (t.closest("[data-rnext]")) { stopSpeak(); return; }   // 읽던 A 대사를 끊으면 playA 가 다음으로 넘어감
  if (t.closest("[data-rmic]")) return roleSpeak();
  if (t.closest("[data-rhint]")) { st.hint = true; return render(false); }
  if (t.closest("[data-rself]")) { dayRec().speak++; ST.stats.speak++; addXP(3); st.R.i++; save(); return playA(); }
  if (t.closest("[data-rprev]")) {   // 바로 앞의 내 대답 차례로 돌아가 다시 말하기
    stopSpeak(); stopListen(); st.tok = (st.tok || 0) + 1; const R = st.R;
    let j = R.i - 1; while (j >= 0 && R.lines[j].who !== "B") j--;
    if (j < 0) return;
    R.i = j; R.scores[j] = undefined; st.hint = false; render(false); return scrollEnd();
  }
  if (t.closest("[data-rskip]")) { stopListen(); st.R.i++; return playA(); }
  /* 단어장 */
  const ds = t.closest("[data-dsrc]"); if (ds) { st.src = ds.dataset.dsrc; st.page = 1; st.q = ""; rootState.dict = { src: st.src }; return render(false); }
  const ty = t.closest("[data-type]"); if (ty) { st.type = ty.dataset.type; st.page = 1; return render(false); }
  const sec = t.closest("[data-sec]"); if (sec) return push("section", { src: st.src, si: +sec.dataset.sec });
  const step = t.closest("[data-step]"); if (step && !step.disabled) { const ctx = ctxLists[st.ctx]; const k = ctx[ctx.indexOf(st.key) + +step.dataset.step]; if (k) { stopSpeak(); st.key = k; return render(true); } return; }
  const one = t.closest("[data-one]"); if (one) { const k = one.dataset.one; return startLesson(seen(k) ? buildLesson([], [k], "review") : buildLesson([k], [], "lesson")); }
  /* 프로필 */
  const gl = t.closest("[data-goal]"); if (gl) { ST.set.goal = +gl.dataset.goal; touchSet(); return render(false); }
  const ra = t.closest("[data-rate]"); if (ra) { ST.set.rate = +ra.dataset.rate; touchSet(); return render(false); }
  const rpt = t.closest("[data-rep]"); if (rpt) { ST.set.repeat = +rpt.dataset.rep; touchSet(); return render(false); }
  if (t.closest("[data-sync-connect]")) { connect(document.getElementById("syncUrl").value, document.getElementById("syncKey").value); return render(false); }
  if (t.closest("[data-sync-now]")) return syncNow(true);
  if (t.closest("[data-sync-link]")) {
    const link = linkFor(ST.sync);
    const show = () => modal(`<h3>다른 기기 연결 링크</h3><p>이 링크를 카카오톡 '나와의 채팅' 등으로 보내서 다른 기기에서 열면 연결돼요. 동기화 키가 들어 있으니 다른 사람에게는 보내지 마세요.</p><input class="search" style="padding:11px 14px;font-size:12px" readonly value="${esc(link)}"><button class="primary" data-keep>닫기</button>`);
    try { navigator.clipboard.writeText(link).then(() => { toast("연결 링크를 복사했어요"); show(); }, show); } catch (e) { show(); }
    return;
  }
  if (t.closest("[data-sync-off]")) { ST.sync = null; save(); toast("이 기기의 연결을 해제했어요. 기록은 그대로 남아 있어요"); return render(false); }
  if (t.closest("[data-reset]")) return modal(`<h3>학습 기록을 초기화할까요?</h3><p>이 기기의 복습 단계, XP, 연속 학습일, 오답노트, 저장한 표현, 도전과제가 지워지고 되돌릴 수 없어요. 구글시트 단어장은 그대로예요.${ST.sync ? " 기기 동기화가 연결되어 있으면 다음 동기화 때 다른 기기 기록이 다시 받아져요." : ""}</p><button class="primary" data-keep>취소</button><button class="ghost" data-reset-yes style="color:var(--hl)">초기화</button>`);
  /* 레슨 */
  const L = st.L; if (!L || st.v !== "lesson") return;
  if (t.closest("[data-next]")) return nextQ();
  const pk = t.closest("[data-pick]"); if (pk && !L.answered) { const q = L.qs[L.i]; q.pick = pk.dataset.pick; answer(q.pick === q.key); if (q.type !== "listen") sayEn(ALL[q.key].en, { repeat: 1 }); return; }
  const tl = t.closest("[data-tile]"); if (tl && !L.answered) { const q = L.qs[L.i]; const i = +tl.dataset.tile; if (!q.picked.includes(i)) q.picked.push(i); return render(false); }
  const ut = t.closest("[data-unpick]"); if (ut && !L.answered) { L.qs[L.i].picked.splice(+ut.dataset.unpick, 1); return render(false); }
  if (t.closest("[data-check]")) return checkCurrent();
  if (t.closest("[data-mic]")) return lessonSpeak();
  const sf = t.closest("[data-self]"); if (sf) { dayRec().speak++; ST.stats.speak++; return answer(sf.dataset.self === "1"); }
  if (t.closest("[data-skip]")) { stopListen(); return nextQ(); }
  if (t.closest("[data-retry-speak]")) { const q = L.qs[L.i]; q.result = null; L.answered = false; return render(false); }
  const sq = t.closest("[data-starq]"); if (sq) { toggleStar(sq.dataset.starq); return lessonFooter(); }
  if (t.closest("[data-redo]")) { st.L = buildLesson([], L.wrongKeys.slice(), "review"); render(true); return autoQ(st.L.qs[0]); }
  if (t.closest("[data-home]")) return goTab("home");
});
document.addEventListener("change", e => { const b = e.target.closest("[data-setbool]"); if (b) { ST.set[b.dataset.setbool] = b.checked; touchSet(); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "Escape") { if (layer.innerHTML) return closeLayer(); if (inLesson()) return askQuit(); if (stack.length > 1) uiBack(); return; }
  if (cur().v !== "lesson") return;
  if (e.key === "Enter") { const b = fbEl.querySelector("[data-next], [data-check]:not([disabled])"); if (b) { e.preventDefault(); b.click(); } }
  if (/^[1-4]$/.test(e.key)) document.querySelectorAll("[data-pick]")[+e.key - 1]?.click();
});
if (TTS) speechSynthesis.onvoiceschanged = () => {};

try { history.replaceState({ d: 1 }, ""); } catch (e) { histOK = false; }
let startTab = "home"; try { startTab = localStorage.getItem(STORE + ".tab") || "home"; } catch (e) {}
goTab(ROOT[startTab] ? startTab : "home");
if (location.hash.startsWith("#sync-")) connectFromLink(); else if (ST.sync) syncNow(false);
})();
</script>
