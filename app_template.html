<title>나의 영어 노트</title>
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 한 손 모바일 앱 — 상단 앱바(뒤로가기·제목) + 화면 스택 + 하단 탭 4개. 남색 잉크 + 황동 포인트, 영어는 세리프로 사전 느낌 */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --surface-2: #EEF0F5; --ink: #141A2A; --muted: #646C80; --line: #E1E4EC;
  --navy: #14213D; --navy-2: #22355E; --brass: #A8834A; --brass-soft: #F3ECDF;
  --hl: #C0392B; --good: #2F7D57; --good-soft: #E3F1EA; --warn: #B7791F; --warn-soft: #F8EEDB; --bad-soft: #F8E4E1;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(20,26,42,.05), 0 8px 24px rgba(20,26,42,.06);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en: "Newsreader", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D111B; --surface: #161C2A; --surface-2: #1D2436; --ink: #E8EAF0; --muted: #98A0B4; --line: #262E42;
  --navy: #1C2A4A; --navy-2: #2A3D68; --brass: #D4B27A; --brass-soft: #2C2618;
  --hl: #FF8A7A; --good: #6CC795; --good-soft: #17301F; --warn: #E8B865; --warn-soft: #33281A; --bad-soft: #3A1F1C;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D111B; --surface: #161C2A; --surface-2: #1D2436; --ink: #E8EAF0; --muted: #98A0B4; --line: #262E42;
  --navy: #1C2A4A; --navy-2: #2A3D68; --brass: #D4B27A; --brass-soft: #2C2618;
  --hl: #FF8A7A; --good: #6CC795; --good-soft: #17301F; --warn: #E8B865; --warn-soft: #33281A; --bad-soft: #3A1F1C;
  --on-navy: #F4F1EA; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 104px; }

/* 앱바 */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-inline: -16px; padding: 12px 16px 10px;
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.appbar h1 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar.root { grid-template-columns: 1fr auto; }
.appbar.root h1 { text-align: left; font-size: 22px; }
.appbar .sync { font-size: 11px; color: var(--muted); font-family: var(--f-num); }
.ibtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink); }
.ibtn:hover { background: var(--surface-2); }
.ibtn svg { width: 22px; height: 22px; }

/* 하단 탭 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
nav.tabs .in { pointer-events: auto; max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 6px; }
nav.tabs button { background: none; border: 0; border-radius: 16px; padding: 7px 4px; display: grid; justify-items: center; gap: 1px; font-size: 11.5px; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--navy); background: var(--surface-2); font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav.tabs button[aria-selected="true"] { color: var(--brass); } }
:root[data-theme="dark"] nav.tabs button[aria-selected="true"] { color: var(--brass); }

/* 공통 */
.en { font-family: var(--f-en); font-weight: 600; letter-spacing: -0.005em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.view { display: grid; gap: 22px; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-weight: 500; color: var(--muted); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
mark { background: none; color: var(--hl); font-weight: 700; }
.primary { border: 0; background: var(--navy); color: var(--on-navy); border-radius: 14px; padding: 13px 18px; font-weight: 600; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; font-weight: 600; }
.block { display: grid; gap: 7px; }
.block p { margin: 0; white-space: pre-line; }

/* 홈 */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px 20px 20px; color: var(--on-navy);
  background: radial-gradient(120% 90% at 100% 0%, var(--navy-2), var(--navy) 60%); display: grid; gap: 10px; box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(212,178,122,.35); }
.hero .label { color: #D4B27A; } /* 남색 배경 위 고정 색 — 두 테마 공통 */
.hero .en { font-size: 30px; line-height: 1.15; font-weight: 500; }
.hero p { margin: 0; }
.hero .ko { opacity: .85; font-size: 14px; }
.hero .think { font-family: var(--f-en); font-size: 15.5px; line-height: 1.5; opacity: .95; }
.hero .think mark { color: #F0CF94; }
.hero .row-btns { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 99px; padding: 7px 14px; color: var(--on-navy); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.hero button svg { width: 16px; height: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { padding: 14px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-num); font-size: 22px; font-weight: 500; }
.kpi span { font-size: 12px; color: var(--muted); }
.prog { padding: 6px 16px; }
.prog-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; padding-block: 10px; border-top: 1px solid var(--line); }
.prog-row:first-child { border-top: 0; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .k { background: var(--good); } .bar .m { background: var(--warn); }

/* 학습 모드 */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.mode .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--brass-soft); color: var(--brass); }
.mode .ic svg { width: 19px; height: 19px; }
.mode b { font-size: 14.5px; }
.mode small { color: var(--muted); font-size: 12px; line-height: 1.45; }
.mode[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy), var(--shadow); }
.opt-group { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }

/* 목록 + 페이지 */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.list { display: grid; overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 13px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .en { font-size: 17.5px; min-width: 0; overflow-wrap: anywhere; }
.row .ko { grid-column: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .side { grid-row: 1 / 3; grid-column: 2; display: grid; justify-items: end; align-content: center; gap: 3px; font-size: 11px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.s1 { background: var(--warn); } .dot.s2 { background: var(--good); }
.star { color: var(--brass); font-size: 12px; }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.pager { display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager button { min-width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: none; font-family: var(--f-num); font-size: 13px; color: var(--muted); padding: 0 6px; }
.pager button[aria-current="page"] { background: var(--navy); color: var(--on-navy); }
.pager button.nav { border-color: var(--line); background: var(--surface); color: var(--ink); }
.pager .gap { color: var(--muted); padding: 0 2px; }
.sec-head { display: grid; gap: 4px; padding-inline: 2px; }
.sec-head h3 { margin: 0; font-size: 15px; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 10.5px; color: var(--brass); background: var(--brass-soft); border-radius: 99px; padding: 1px 8px; margin-left: 6px; font-weight: 700; vertical-align: 2px; }
.sec-list { display: grid; gap: 8px; }
.sec-btn { text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.sec-btn b { font-size: 15px; } .sec-btn small { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.sec-btn .num { grid-row: 1 / 3; grid-column: 2; color: var(--muted); font-size: 12px; }

/* 상세 */
.detail-head { display: grid; gap: 10px; padding: 20px; }
.detail-head .en { font-size: 32px; line-height: 1.12; overflow-wrap: anywhere; font-weight: 500; }
.detail-head .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13px; }
.pill svg { width: 16px; height: 16px; }
.pill.on { color: var(--brass); border-color: var(--brass); }
.pic { background: var(--brass-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.thinkbox { border-left: 3px solid var(--brass); padding: 2px 0 2px 14px; }
.thinkbox p { font-family: var(--f-en); font-size: 17.5px; line-height: 1.55; white-space: normal; }
.ex { display: grid; }
.ex-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; padding-block: 11px; border-top: 1px solid var(--line); }
.ex-item:first-child { border-top: 0; padding-top: 0; }
.ex-item .e { font-family: var(--f-en); font-size: 16.5px; white-space: pre-line; min-width: 0; }
.ex-item .k { grid-column: 1; color: var(--muted); font-size: 13px; white-space: pre-line; }
.say { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; grid-row: 1 / 3; grid-column: 2; }
.say svg { width: 18px; height: 18px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pair > div { min-width: 0; }
.mark-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mark-row button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; font-weight: 600; }
.mark-row button.on1 { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.mark-row button.on2 { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.stepper { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.stepper .num { font-size: 12px; color: var(--muted); text-align: center; }

/* 오디오 바 */
.audio { padding: 12px 14px; display: grid; gap: 10px; }
.audio-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.audio-row .label { min-width: 52px; }
.audio .seg button { padding: 4px 11px; font-size: 12.5px; font-family: var(--f-num); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--navy); }

/* 세션(카드·퀴즈) */
.sess-top { display: grid; gap: 8px; }
.sess-top .meta b { color: var(--ink); }
.progress { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brass); transition: width .25s; }
.card { min-height: 330px; padding: 26px 22px; display: grid; align-content: center; gap: 14px; text-align: center; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); }
.card .en { font-size: 32px; line-height: 1.18; overflow-wrap: anywhere; font-weight: 500; }
.card .kq { font-size: 19px; font-weight: 600; white-space: pre-line; }
.card .hint { color: var(--muted); font-size: 13px; }
.card .back { display: grid; gap: 10px; text-align: left; border-top: 1px solid var(--line); padding-top: 14px; }
.card .back .mean { font-size: 16.5px; font-weight: 600; white-space: pre-line; }
.card .back .e { font-family: var(--f-en); font-size: 15.5px; white-space: pre-line; }
.card .back .k { color: var(--muted); font-size: 13px; white-space: pre-line; }
.card .back .t { font-family: var(--f-en); font-size: 14.5px; }
.big-say { justify-self: center; display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--brass-soft); color: var(--ink); border-radius: 99px; padding: 10px 18px; font-weight: 600; }
.big-say svg { width: 20px; height: 20px; color: var(--brass); }
.big-say.playing { box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 35%, transparent); }
.answer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.answer button { border: 0; border-radius: 14px; padding: 14px 6px; font-weight: 600; }
.answer .a0 { background: var(--bad-soft); color: var(--hl); } .answer .a1 { background: var(--warn-soft); color: var(--warn); } .answer .a2 { background: var(--good-soft); color: var(--good); }
.navrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.choice .en { font-size: 17px; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--hl); background: var(--bad-soft); }
.qbox { padding: 22px 20px; display: grid; gap: 12px; text-align: center; }
.qbox .q { font-size: 18px; font-weight: 600; white-space: pre-line; }
.qbox .sent { font-family: var(--f-en); font-size: 19px; line-height: 1.5; }
.qbox .sent u { text-decoration: none; border-bottom: 2px solid var(--brass); padding: 0 1.6em; }
.qbox .sub { color: var(--muted); font-size: 13px; }
.typing { display: flex; gap: 8px; }
.typing input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-family: var(--f-en); font-size: 18px; }
.feedback { border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.feedback.ok { background: var(--good-soft); } .feedback.no { background: var(--bad-soft); }
.feedback b { font-size: 14px; } .feedback .en { font-size: 17px; }
.done { text-align: center; display: grid; gap: 12px; padding: 28px 20px; }
.done .big { font-size: 46px; font-family: var(--f-num); font-weight: 500; }
.done .ring { width: 120px; height: 120px; justify-self: center; }
.listen-stage { padding: 30px 22px; text-align: center; display: grid; gap: 14px; min-height: 300px; align-content: center; }
.listen-stage .en { font-size: 30px; line-height: 1.2; font-weight: 500; }
.listen-stage .ko { font-size: 16px; color: var(--muted); white-space: pre-line; }
.listen-stage .e { font-family: var(--f-en); font-size: 17px; white-space: pre-line; }
.phase { display: flex; justify-content: center; gap: 6px; }
.phase span { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.phase span.on { background: var(--navy); color: var(--on-navy); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="appbar root" id="appbar"></header>
  <main id="main"></main>
</div>

  <button role="tab" data-tab="think" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>영어식 사고</button>
  <button role="tab" data-tab="study" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>학습</button>

<script id="vocab-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("vocab-data").textContent);
const SRC_NAME = { w: "단어장", p: "구동사·숙어", t: "문장패턴" };
const SOURCES = { w: [], p: [], t: [] };
DATA.words.forEach(w => SOURCES.w.push({ ...w, key: "w:" + w.no, src: "w", en: w.w, ko: w.mean }));
[["p", "phrasal"], ["t", "pattern"]].forEach(([src, k]) => DATA[k].forEach((sec, si) => sec.items.forEach(it =>
  SOURCES[src].push({ ...it, key: src + ":" + it.expr, src, en: it.expr, si, isNew: sec.title.startsWith("➕") }))));
const ALL = {};
Object.values(SOURCES).forEach(list => list.forEach(i => { ALL[i.key] = i; }));
const PAGE = 10;

/* ---------- 저장(이 기기 브라우저) ---------- */
const STORE = "vocab-note.v2";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const prog = load(STORE, load("vocab-note.v1", {}));      // key -> {s:0|1|2, t}
const stars = new Set(load(STORE + ".stars", []));
const days = load(STORE + ".days", {});                    // "YYYY-MM-DD" -> 학습 개수
const audio = Object.assign({ rate: 0.9, repeat: 1, auto: true, gap: 0.6 }, load(STORE + ".audio", {}));
const status = k => (prog[k] ? prog[k].s : -1);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function setStatus(k, s) { prog[k] = { s, t: Date.now() }; keep(STORE, prog); days[today()] = (days[today()] || 0) + 1; keep(STORE + ".days", days); }
function toggleStar(k) { stars.has(k) ? stars.delete(k) : stars.add(k); keep(STORE + ".stars", [...stars]); }
function streak() {
  let n = 0; const d = new Date();
  if (!days[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (!days[k]) return n; n++; d.setDate(d.getDate() - 1); }
}

/* ---------- 유틸 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const marked = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
const plain = s => String(s ?? "").replace(/\*\*/g, "");
const firstLine = s => String(s ?? "").split("\n")[0].replace(/^1\.\s*/, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const IC = {

  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',

  choice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg>',

  loop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',

};

/* ---------- 음성(반복·속도) ---------- */
const TTS = "speechSynthesis" in window;
let speakToken = 0;
function voiceFor(lang) { return TTS ? speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith(lang)) : null; }
function ttsText(text) { return plain(text).replace(/^[AB]:\s*/gm, "").replace(/\+\s*[가-힣/·\-]+/g, "").replace(/[가-힣]+/g, "").replace(/[~()[\]]/g, " ").replace(/\s+/g, " ").trim(); }
function utter(text, lang, rate) {
  return new Promise(res => {
    if (!TTS || !text) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate; const v = voiceFor(lang.slice(0, 2) === "en" ? "en-US" : lang); if (v) u.voice = v;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function stopSpeak() { speakToken++; if (TTS) speechSynthesis.cancel(); document.querySelectorAll(".playing").forEach(b => b.classList.remove("playing")); }
/* 영어를 설정된 횟수·속도로 반복 재생 */
async function sayEn(text, opt = {}) {
  stopSpeak(); const my = speakToken; const t = ttsText(text); if (!t) return;
  const times = opt.repeat ?? audio.repeat;
  opt.btn?.classList.add("playing");
  for (let i = 0; i < times && my === speakToken; i++) { await utter(t, "en-US", audio.rate); if (i < times - 1) await wait(audio.gap * 1000); }
  if (my === speakToken) opt.btn?.classList.remove("playing");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if (!b) return;
  e.stopPropagation(); sayEn(b.dataset.say, { btn: b, repeat: b.dataset.once ? 1 : undefined });
}, true);
function audioBar() {
  return `<div class="panel audio" id="audiobar">
    <div class="audio-row"><span class="label">속도</span><div class="seg">${[0.6, 0.75, 0.9, 1.0, 1.2].map(r => `<button data-rate="${r}" aria-pressed="${audio.rate === r}">${r}x</button>`).join("")}</div></div>
    <div class="audio-row"><span class="label">반복</span><div class="seg">${[1, 2, 3, 5].map(n => `<button data-rep="${n}" aria-pressed="${audio.repeat === n}">${n}회</button>`).join("")}</div></div>
    <div class="audio-row"><label class="toggle"><input type="checkbox" id="autoplay" ${audio.auto ? "checked" : ""}>카드가 나오면 자동으로 듣기</label></div>
  </div>`;
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-rate]"), n = e.target.closest("[data-rep]");
  if (!r && !n) return;
  if (r) audio.rate = +r.dataset.rate; if (n) audio.repeat = +n.dataset.rep;
  keep(STORE + ".audio", audio);
  const bar = document.getElementById("audiobar"); if (bar) bar.outerHTML = audioBar();
});
document.addEventListener("change", e => { if (e.target.id === "autoplay") { audio.auto = e.target.checked; keep(STORE + ".audio", audio); } });

/* ---------- 화면 스택(뒤로가기) ---------- */
const main = document.getElementById("main"), appbar = document.getElementById("appbar");
const TAB_ROOT = { home: "home", words: "words", think: "think", study: "study" };
let tab = "home";
let stack = [{ v: "home" }];
let histOK = true;
function cur() { return stack[stack.length - 1]; }
function push(v, p = {}) {
  stopSpeak(); stack.push({ v, ...p });
  if (histOK) { try { history.pushState({ d: stack.length }, ""); } catch (e) { histOK = false; } }
  render(true);
}
function replace(p) { Object.assign(cur(), p); render(false); }
function back() {
  if (stack.length <= 1) return;
  stopSpeak(); stack.pop(); render(true);
}
let ignorePop = 0;
window.addEventListener("popstate", () => { if (ignorePop) { ignorePop--; return; } if (stack.length > 1) back(); });
function uiBack() { if (histOK && stack.length > 1) { try { history.back(); return; } catch (e) {} } back(); }
function goTab(t) {
  stopSpeak();
  const extra = stack.length - 1;
  if (histOK && extra > 0) { ignorePop++; try { history.go(-extra); } catch (e) { ignorePop = 0; } }
  tab = t; stack = [{ v: TAB_ROOT[t], ...(rootState[t] || {}) }];
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  keep(STORE + ".tab", t);
  render(true);
}
const rootState = {};
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) goTab(b.dataset.tab); });

function bar(title, opts = {}) {
  if (stack.length <= 1) {
    appbar.className = "appbar root";
    appbar.innerHTML = `<h1>${esc(title)}</h1><span class="sync">${DATA.synced ? "시트 " + esc(DATA.synced) + " 기준" : ""}</span>`;
  } else {
    appbar.className = "appbar";
    appbar.innerHTML = `<button class="ibtn" data-back aria-label="뒤로가기">${IC.back}</button><h1>${esc(title)}</h1>${opts.right || "<span></span>"}`;
  }
}
appbar.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) return uiBack();
  const s = e.target.closest("[data-star]"); if (s) { toggleStar(s.dataset.star); render(false); }
});

/* ---------- 페이지 넘김 ---------- */
function pager(page, pages) {
  if (pages <= 1) return "";
  const nums = new Set([1, pages, page - 1, page, page + 1].filter(n => n >= 1 && n <= pages));
  const list = [...nums].sort((a, b) => a - b);
  let html = `<button class="nav" data-page="${page - 1}" ${page === 1 ? "disabled" : ""} aria-label="이전 페이지">‹ 이전</button>`;
  list.forEach((n, i) => {
    if (i && n - list[i - 1] > 1) html += '<span class="gap">…</span>';
    html += `<button data-page="${n}" ${n === page ? 'aria-current="page"' : ""}>${n}</button>`;
  });
  return `<div class="pager">${html}<button class="nav" data-page="${page + 1}" ${page === pages ? "disabled" : ""} aria-label="다음 페이지">다음 ›</button></div>`;
}
function paged(list, page) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  const p = Math.min(Math.max(1, page || 1), pages);
  return { p, pages, items: list.slice((p - 1) * PAGE, p * PAGE) };
}
function rowHTML(i, ctx) {
  const s = status(i.key);
  return `<button class="row" data-open="${esc(i.key)}" data-ctx="${ctx}"><span class="en">${esc(i.en)}</span>
    <span class="side"><span>${stars.has(i.key) ? '<span class="star">★</span> ' : ""}<span class="dot ${s === 2 ? "s2" : s >= 0 ? "s1" : ""}" style="display:inline-block"></span></span>${i.no ? `<span class="num">No.${esc(i.no.split(" ")[0])}</span>` : ""}</span>
    <span class="ko">${esc(firstLine(i.ko))}</span></button>`;
}
const ctxLists = {};  // 상세 화면 이전/다음용: 목록 이름 -> key 배열

/* ---------- 오늘 ---------- */
function dayPick() {
  const pool = [...SOURCES.p, ...SOURCES.t];
  const d = new Date(); const seed = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
  return pool[(seed * 7919) % pool.length];
}
function counts(src) {
  let k = 0, m = 0;
  for (const i of SOURCES[src]) { const s = status(i.key); if (s === 2) k++; else if (s >= 0) m++; }
  return { n: SOURCES[src].length, k, m };
}
function vHome() {

      <div class="bar"><i class="k" style="width:${(c.k / c.n) * 100}%"></i><i class="m" style="width:${(c.m / c.n) * 100}%"></i></div></div>`; }).join("")}</div>
    <p class="note">초록: 외움 · 노랑: 헷갈림/모름 · 회색: 아직 안 봄</p>

/* ---------- 단어장 ---------- */
function wordType(w) { return ["단어", "숙어", "문장"].includes(w.type) ? w.type : "기타"; }

  const st = cur(); st.type ??= "전체"; st.q ??= ""; st.page ??= 1;
  bar("단어장");
  const q = st.q.trim().toLowerCase();
  let list = SOURCES.w.filter(w => st.type === "전체" || (st.type === "★" ? stars.has(w.key) : st.type === "헷갈림" ? status(w.key) >= 0 && status(w.key) < 2 : wordType(w) === st.type));
  if (q) list = list.filter(w => w.en.toLowerCase().includes(q) || w.mean.includes(q));
  list.sort((a, b) => +b.no - +a.no);
  ctxLists.words = list.map(i => i.key);

}

/* 빈칸: 예문에서 표현(또는 변형) 위치 찾기 */
function blankOf(item) {
  const core = item.en.replace(/\(.*?\)|\+.*$|[~…]|\/.*$/g, " ").replace(/\b(sb|sth|someone|something|one's)\b/gi, " ").trim().split(/\s+/).filter(Boolean);
  if (!core.length) return null;
  const pat = core.map(w => { const b = w.replace(/[^A-Za-z']/g, ""); if (!b) return null; const stem = b.length > 4 ? b.slice(0, Math.max(3, b.length - 2)) : b; return stem.replace(/'/g, "['’]") + "[A-Za-z'’]*"; });
  if (pat.includes(null)) return null;
  const re = new RegExp("\\b" + pat.join("\\s+(?:\\w+\\s+){0,2}?") + "\\b", "i");
  for (const [e, k] of shuffle(item.ex)) {
    const line = e.split("\n").find(l => re.test(l)); if (!line) continue;
    const m = line.match(re);
    if (m && m[0].length < line.length * 0.8) return { before: line.slice(0, m.index).replace(/^[AB]:\s*/, ""), ans: m[0], after: line.slice(m.index + m[0].length), ko: k, full: line };
  }
  return null;
}
function makeSession(mode, src, scope, count, si) {
  let pool = scopeList(src, scope, si);
  let picks = shuffle(pool);
  if (scope === "weak" || scope === "all") picks.sort((a, b) => (status(a.key) === 2) - (status(b.key) === 2));
  let qs = [];
  for (const it of picks) {
    if (qs.length >= count) break;
    const q = { key: it.key };
    if (["choice", "listen", "blank"].includes(mode)) {
      if (mode === "blank") { q.blank = blankOf(it); if (!q.blank) continue; }
      const others = shuffle(SOURCES[src].filter(o => o.key !== it.key && firstLine(o.ko) !== firstLine(it.ko))).slice(0, 3);
      q.opts = shuffle([it, ...others]).map(o => o.key);
    }
    if (mode === "type") { const t = ttsText(it.en); if (!t || t.split(" ").length > 6) continue; q.target = t; }
    qs.push(q);
  }
  return { mode, src, qs, i: 0, ans: {}, flipped: {} };
}
function startSession(mode, src, scope, count, si) {
  const s = makeSession(mode, src, scope, count, si);
  if (!s.qs.length) { alertBox("이 범위에서는 이 방법으로 낼 문제가 없어요. 다른 범위나 방법을 골라 보세요."); return; }
  push("session", { s });
}
function alertBox(msg) { const n = document.querySelector(".note.warnmsg"); if (n) n.textContent = msg; else main.insertAdjacentHTML("beforeend", `<p class="note warnmsg" style="color:var(--hl)">${esc(msg)}</p>`); }

/* ---------- 세션 화면 ---------- */
function vSession() {
  const s = cur().s; const M = MODES[s.mode];

    else if (s.mode === "listen") qhtml = `<span class="label">들리는 표현을 고르세요</span><button class="big-say" style="padding:16px 26px;font-size:16px" data-say="${esc(it.en)}">${IC.speak}다시 듣기 · ${audio.rate}x</button>${answered ? `<span class="en" style="font-size:24px">${esc(it.en)}</span>` : ""}`;
    else { const b = q.blank; qhtml = `<span class="label">빈칸에 들어갈 표현은?</span><span class="sent">${esc(b.before)}<u>${answered ? esc(b.ans) : ""}</u>${esc(b.after)}</span><span class="sub">${esc(b.ko)}</span>`; }
    const pick = s.ans[q.key];
    const opts = q.opts.map(k => { const o = ALL[k];

      const main = s.mode === "choice" ? `<span>${esc(firstLine(o.ko))}</span>` : `<span class="en">${esc(o.en)}</span>${answered ? `<span class="note">${esc(firstLine(o.ko))}</span>` : ""}`;
      return `<button class="choice ${cls}" data-pick="${esc(k)}" ${answered ? "disabled" : ""}>${main}</button>`; }).join("");
    return `${top}<div class="panel qbox">${qhtml}</div><div class="choices">${opts}</div>

      <button class="big-say" style="padding:16px 26px;font-size:16px" data-say="${esc(it.en)}">${IC.speak}다시 듣기 · ${audio.rate}x</button>
      <span class="sub">힌트: ${esc(firstLine(it.ko))} · ${q.target.length}글자</span></div>
      ${answered ? feedback(norm(given) === norm(q.target), it, given) : `<form class="typing" data-typeform><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="들리는 대로 입력"><button class="primary">확인</button></form>`}

    return `${top}<div class="panel listen-stage">
      <div class="phase"><span class="${ph === 0 ? "on" : ""}">영어</span><span class="${ph === 1 ? "on" : ""}">뜻</span><span class="${ph === 2 ? "on" : ""}">예문</span></div>
      <span class="en">${esc(it.en)}</span>
      <span class="ko">${ph >= 1 ? meaning : "&nbsp;"}</span>
      ${ph >= 2 && ex ? `<span class="e">${esc(ex[0])}</span><span class="note">${esc(ex[1])}</span>` : ""}
      <button class="big-say" data-loop-toggle>${cur().playing ? IC.pause + "일시정지" : IC.play + "재생"}</button>
    </div>
    <div class="navrow"><button class="ghost" data-loop-step="-1" ${s.i === 0 ? "disabled" : ""}>‹ 이전</button><button class="ghost" data-loop-step="1">${s.i === s.qs.length - 1 ? "끝내기" : "다음 ›"}</button></div>
    ${audioBar()}

const norm = s => String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
function feedback(ok, it, given) {
  return `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "정답이에요" : "아쉬워요"}</b>
    ${given !== undefined && !ok ? `<span class="note">입력: ${esc(given || "(비어 있음)")}</span>` : ""}
    <span class="en">${esc(it.en)}</span><span class="note">${esc(firstLine(it.src === "w" ? it.mean : it.ko))}</span>

function vResult(s) {

    : keys.filter(k => s.ans[k] === 2).length;
  const wrongKeys = graded ? s.qs.filter(q => !(s.mode === "type" ? norm(s.ans[q.key]) === norm(q.target) : s.ans[q.key] === q.key)).map(q => q.key)
    : keys.filter(k => s.ans[k] !== 2);

  const pct = keys.length ? right / keys.length : 0;
  const C = 2 * Math.PI * 52;
  return `<div class="panel done">
      <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-2)" stroke-width="10"/>

    </div>

/* 연속 듣기 진행 */
let loopRun = 0;
async function runLoop() {
  const st = cur(); if (st.v !== "session" || st.s.mode !== "loop") return;
  const my = ++loopRun; st.playing = true;
  while (st.playing && my === loopRun && st.s.i < st.s.qs.length) {
    const it = ALL[st.s.qs[st.s.i].key];
    st.phase = 0; render(false); stopSpeak(); const tok = speakToken;
    for (let r = 0; r < audio.repeat && tok === speakToken; r++) { await utter(ttsText(it.en), "en-US", audio.rate); await wait(audio.gap * 1000); }
    if (tok !== speakToken || my !== loopRun) return;
    st.phase = 1; render(false);
    await utter(firstLine(it.src === "w" ? it.mean : it.ko).replace(/[~/]/g, " "), "ko-KR", Math.min(1.1, audio.rate + 0.1)); await wait(400);
    if (tok !== speakToken || my !== loopRun) return;
    st.phase = 2; render(false);
    if (it.ex[0]) await utter(ttsText(it.ex[0][0]), "en-US", audio.rate);
    if (tok !== speakToken || my !== loopRun) return;
    await wait(900);
    st.s.ans[it.key] = 1; st.s.i++; st.phase = 0;
  }
  st.playing = false; render(false);
}
function stopLoop() { loopRun++; const st = cur(); if (st.v === "session") st.playing = false; stopSpeak(); }

/* ---------- 렌더 ---------- */
const VIEWS = { home: vHome, words: vWords, think: vThink, section: vSection, detail: vDetail, study: vStudy, session: vSession };
function render(scrollTop) {
  const st = cur();
  main.innerHTML = `<section class="view">${VIEWS[st.v]()}</section>`;
  if (scrollTop) window.scrollTo(0, 0);
  bindInputs();
  if (st.v === "session" && scrollTop) autoSpeak();
}
function autoSpeak() {
  const s = cur().s; if (!s || s.i >= s.qs.length) return;
  const it = ALL[s.qs[s.i].key];
  if (s.mode === "listen" || s.mode === "type") sayEn(it.en);
  else if (s.mode === "flash" && audio.auto) sayEn(it.en);
}
function bindInputs() {
  for (const id of ["q", "tq"]) {
    const inp = document.getElementById(id); if (!inp) continue;
    inp.addEventListener("input", () => {
      cur().q = inp.value; cur().page = 1; const pos = inp.selectionStart; render(false);
      const n = document.getElementById(id); n.focus(); n.setSelectionRange(pos, pos);
    });
  }
  const t = document.getElementById("typed"); if (t) t.focus({ preventScroll: true });
}

main.addEventListener("submit", e => {
  if (!e.target.matches("[data-typeform]")) return; e.preventDefault();
  const s = cur().s; const q = s.qs[s.i]; const v = document.getElementById("typed").value;
  s.ans[q.key] = v; setStatus(q.key, norm(v) === norm(q.target) ? 2 : 0); render(false); sayEn(ALL[q.key].en, { repeat: 1 });
});
main.addEventListener("click", e => {
  const t = e.target; const st = cur();
  const open = t.closest("[data-open]"); if (open) { stopLoop(); return push("detail", { key: open.dataset.open, ctx: open.dataset.ctx }); }
  const tg = t.closest("[data-tabgo]"); if (tg) return goTab(tg.dataset.tabgo);
  const pg = t.closest("[data-page]"); if (pg && !pg.disabled) { st.page = +pg.dataset.page; return render(true); }
  const ty = t.closest("[data-type]"); if (ty) { st.type = ty.dataset.type; st.page = 1; return render(false); }
  const ts = t.closest("[data-tsrc]"); if (ts) { st.src = ts.dataset.tsrc; st.page = 1; rootState.think = { src: st.src }; return render(false); }
  const sec = t.closest("[data-sec]"); if (sec) return push("section", { src: st.src, si: +sec.dataset.sec });
  const ss = t.closest("[data-sec-study]"); if (ss) return startSession("flash", st.src, "all", 50, st.si);
  const step = t.closest("[data-step]"); if (step && !step.disabled) { const ctx = ctxLists[st.ctx]; const k = ctx[ctx.indexOf(st.key) + +step.dataset.step]; if (k) { stopSpeak(); st.key = k; return render(true); } }
  const set = t.closest("[data-set]"); if (set) { setStatus(st.key, +set.dataset.set); return render(false); }
  /* 학습 허브 */
  const qk = t.closest("[data-quick]"); if (qk) { Object.assign(study, { mode: qk.dataset.quick, src: qk.dataset.src }); keep(STORE + ".study", study); return startSession(study.mode, study.src, study.scope, study.count); }
  const md = t.closest("[data-mode]"); if (md) { study.mode = md.dataset.mode; keep(STORE + ".study", study); return render(false); }
  const sr = t.closest("[data-ssrc]"); if (sr) { study.src = sr.dataset.ssrc; keep(STORE + ".study", study); return render(false); }
  const sc = t.closest("[data-scope]"); if (sc) { study.scope = sc.dataset.scope; keep(STORE + ".study", study); return render(false); }
  const ct = t.closest("[data-count]"); if (ct) { study.count = +ct.dataset.count; keep(STORE + ".study", study); return render(false); }
  if (t.closest("[data-start]")) return startSession(study.mode, study.src, study.scope, study.count);
  /* 세션 */
  const s = st.s; if (!s) return;
  if (t.closest("[data-flip]")) { s.flipped[s.i] = true; render(false); if (s.mode === "rev" && audio.auto) sayEn(ALL[s.qs[s.i].key].en); return; }
  const ra = t.closest("[data-rate-ans]"); if (ra) { const k = s.qs[s.i].key; s.ans[k] = +ra.dataset.rateAns; setStatus(k, s.ans[k]); s.i++; return render(true); }
  const pk = t.closest("[data-pick]"); if (pk && !pk.disabled) { const q = s.qs[s.i]; s.ans[q.key] = pk.dataset.pick; setStatus(q.key, pk.dataset.pick === q.key ? 2 : 0); render(false); if (s.mode !== "listen") sayEn(ALL[q.key].en, { repeat: 1 }); return; }
  if (t.closest("[data-sprev]")) { s.i = Math.max(0, s.i - 1); return render(true); }
  if (t.closest("[data-snext]")) { s.i++; return render(true); }
  const ls = t.closest("[data-loop-step]"); if (ls) { const was = st.playing; stopLoop(); s.i = Math.max(0, s.i + +ls.dataset.loopStep); st.phase = 0; render(true); if (was && s.i < s.qs.length) runLoop(); return; }
  if (t.closest("[data-loop-toggle]")) { if (st.playing) { stopLoop(); render(false); } else runLoop(); return; }
  if (t.closest("[data-retry]")) { const keys = ctxLists.wrong.slice(); const ns = makeSession(s.mode, s.src, "all", 0); ns.qs = keys.map(k => makeQ(s.mode, k)).filter(Boolean); st.s = ns; return render(true); }
  if (t.closest("[data-again]")) { st.s = makeSession(s.mode, s.src, study.scope, s.qs.length); return render(true); }
  if (t.closest("[data-tohub]")) return goTab("study");
});
function makeQ(mode, key) {
  const it = ALL[key]; const q = { key };
  if (["choice", "listen", "blank"].includes(mode)) {
    if (mode === "blank") { q.blank = blankOf(it); if (!q.blank) return null; }
    q.opts = shuffle([it, ...shuffle(SOURCES[it.src].filter(o => o.key !== key)).slice(0, 3)]).map(o => o.key);
  }
  if (mode === "type") q.target = ttsText(it.en);
  return q;
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;

  if (e.key === "ArrowRight") document.querySelector("[data-snext]:not([disabled]), [data-loop-step='1']")?.click();
  if (e.key === "ArrowLeft") document.querySelector("[data-sprev]:not([disabled]), [data-loop-step='-1']:not([disabled])")?.click();
  if (e.key === " ") { e.preventDefault(); document.querySelector("[data-flip]")?.click(); }
});
if (TTS) speechSynthesis.onvoiceschanged = () => {};

try { history.replaceState({ d: 1 }, ""); } catch (e) { histOK = false; }
const startTab = load(STORE + ".tab", "home");
goTab(TAB_ROOT[startTab] ? startTab : "home");
})();
