name: Send Daily Commute English

on:
  schedule:
    # 한국 시간(KST, UTC+9) 기준 매일 오전 8시 (UTC 전날 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 2026-11-30까지만 실행 (지나면 이 자동화를 스스로 끔)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -gt 20261130 ]; then
            gh workflow disable "${{ github.workflow }}" -R "${{ github.repository }}"
            echo "실행 기간(2026-11-30)이 끝나 자동화를 껐습니다."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python send_daily.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
