name: Daily English Review

on:
  schedule:
    # 한국 시간(KST, UTC+9) 기준 매일 오전 7:30 (UTC 전날 22:30)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 2026-11-30까지만 실행 (지나면 이 자동화를 스스로 끔)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -gt 20261130 ]; then
            gh workflow disable "${{ github.workflow }}" -R "${{ github.repository }}"
            echo "실행 기간(2026-11-30)이 끝나 자동화를 껐습니다."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (needed by pydub for audio export)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Fetch today's review content from Notion
        run: python notion_fetch.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Build review page (TTS + HTML)
        run: python review_build.py review_input.txt

      - name: Commit and push updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/review.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "일일 영어 리뷰 갱신"
          git push

      - name: Send Kakao notification
        run: |
          SUMMARY=$(grep "^SUMMARY_KO:" review_input.txt | sed 's/^SUMMARY_KO: *//')
          python review_send_ci.py "$SUMMARY"
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
